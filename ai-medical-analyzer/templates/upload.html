<!DOCTYPE html>
<html>
<head>
    <title>Upload Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(180deg, #f4f8ff 0%, #ffffff 100%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            color: #1d315d;
        }

        .upload-shell {
            max-width: 880px;
            margin: 3.5rem auto 0;
        }

        .upload-card {
            border-radius: 22px;
            border: 1px solid #d7e3ff;
            box-shadow: 0 20px 55px rgba(39, 84, 171, 0.08);
        }

        .upload-card .card-body {
            padding: 2rem;
        }

        .upload-title {
            font-size: 2.1rem;
            font-weight: 700;
            color: #183b78;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .upload-label {
            display: block;
            font-size: 1.2rem;
            font-weight: 600;
            color: #244a8f;
            margin-bottom: 0.85rem;
        }

        .upload-input {
            font-size: 1.1rem;
            padding: 0.85rem 1rem;
            min-height: 62px;
            border-radius: 14px;
            font-weight: 500;
        }

        .upload-actions .btn {
            font-size: 1.1rem;
            padding: 0.8rem 1.3rem;
            border-radius: 12px;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .upload-shell {
                margin-top: 2rem;
            }

            .upload-card .card-body {
                padding: 1.25rem;
            }

            .upload-title {
                font-size: 1.6rem;
            }

            .upload-label,
            .upload-input,
            .upload-actions .btn {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">{{ ui_text('app_name') }}</a>
            <div class="d-flex gap-2">
                <a href="{{ url_for('profile') }}" class="btn btn-outline-light btn-sm">{{ ui_text('profile') }}</a>
                <a href="{{ url_for('logout') }}" class="btn btn-light btn-sm">{{ ui_text('logout') }}</a>
            </div>
        </div>
    </nav>
    <div class="container upload-shell">
        <h2 class="upload-title">{{ ui_text('upload_report') }}</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <div class="card upload-card mt-4">
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="upload-label">Select Report File (PDF, JPG, PNG)</label>
                        <input type="file" name="report_file" class="form-control upload-input" accept=".pdf,.jpg,.jpeg,.png" required>
                    </div>
                    <div class="upload-actions d-flex flex-wrap gap-2 justify-content-center justify-content-md-start">
                        <button type="submit" class="btn btn-primary">Upload & Analyze</button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
