<!DOCTYPE html>
<html>
<head>
    <title>{{ ui_text('profile_settings') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(180deg, #f4f8ff 0%, #ffffff 100%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        }

        .profile-card {
            max-width: 720px;
            margin: 3rem auto;
            border-radius: 22px;
            border: 1px solid #d7e3ff;
            box-shadow: 0 20px 55px rgba(39, 84, 171, 0.08);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">{{ ui_text('app_name') }}</a>
            <a href="{{ url_for('logout') }}" class="btn btn-light btn-sm">{{ ui_text('logout') }}</a>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} mt-4">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <div class="card profile-card">
            <div class="card-body p-4">
                <h2 class="mb-4">{{ ui_text('profile_settings') }}</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">{{ ui_text('full_name') }}</label>
                        <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" value="{{ user.email }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ ui_text('mobile_number') }}</label>
                        <input type="tel" name="mobile" class="form-control" value="{{ user.mobile }}" maxlength="10" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ ui_text('new_password') }}</label>
                        <input type="password" name="password" class="form-control" minlength="8">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ ui_text('confirm_password') }}</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="8">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">{{ ui_text('update_profile') }}</button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">{{ ui_text('back_to_dashboard') }}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
